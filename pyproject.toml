[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ML_Timeseries"
dynamic = ["version"]
description = "Machine Learning Time Series Analysis"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [{name = "main", email = "bthekkel1@gmail.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = []

[project.urls]
Repository = "https://github.com/bthek1/ML_Timeseries"
Documentation = "https://bthek1.github.io/ML_Timeseries"

[project.entry-points.nbdev]
ML_Timeseries = "ML_Timeseries._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "ML_Timeseries.__version__"}

[tool.setuptools.packages.find]
include = ["ML_Timeseries"]

[tool.nbdev]
custom_sidebar = true
jupyter_hooks = true
